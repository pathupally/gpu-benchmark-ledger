[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-ledger"
version = "0.1.0"
description = "A vintage-preserving ledger for compute benchmark basis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Compute Futures Research"}]
dependencies = []

[project.scripts]
benchmark-ledger = "benchmark_ledger.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

