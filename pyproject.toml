[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "compute-benchmark-ledger"
version = "1.0.0"
description = "Vintage-aware comparability and tracking analysis for compute benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Adrian Mathew"}]
dependencies = []

[project.scripts]
benchmark-ledger = "benchmark_ledger.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
